<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Future Forecast</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/FutureForecast.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">
AI Real Estate
</div>

<a href="Dashboard.html">
🏠 Dashboard
</a>

</nav>

<div class="container">

<h1>Future Property Price Forecast</h1>

<div class="row">

<div class="inputBox">

<label>Current Property Price (₹)</label>

<input
type="number"
id="price"
placeholder="Enter Current Price">

</div>

<div class="inputBox">

<label>Growth Rate (%)</label>

<input
type="number"
id="growth"
placeholder="Example 8">

</div>

</div>

<div class="row">

<div class="inputBox">

<label>Forecast Years</label>

<select id="years">

<option value="1">1 Year</option>
<option value="2">2 Years</option>
<option value="3">3 Years</option>
<option value="5">5 Years</option>
<option value="10">10 Years</option>

</select>

</div>

</div>

<button onclick="forecastPrice()">

Forecast Price

</button>

<div class="result">

<h2 id="forecastResult">

Future Price :
₹ 0

</h2>

</div>

</div>

<script src="{{ url_for('static', filename='js/FutureForecast.js') }}"></script>

</body>
</html>
