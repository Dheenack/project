<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/InteractiveMap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/static.css') }}">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>
    <div class="container">
        <nav class="navbar-custom d-flex justify-content-between align-items-center">

            <div class="logo" onclick="window.location.href = '/'">
                <i class="fa-solid fa-building"></i>
                <span>AI Real Estate</span>
            </div>

            <ul class="nav-links">
                <li><a href="/#modules">Features</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/map">Map</a></li>
            </ul>

            <button class="nav-button" onclick="openPricePrediction()">
                Predict Price
            </button>

        </nav>
        <h1 class="mt-3">Interactive Property Map</h1>

        <div class="controls">

            <label>Select City</label>

            <select id="city">
                {% for city in locations | map(attribute='city') | unique | sort %}
                <option value="{{ city }}">{{ city }}</option>
                {% endfor %}
            </select>

            <button onclick="showLocation()">
                Show Location
            </button>

        </div>

        <div id="map"></div>

    </div>
    <script>
        const locations = {{ locations | tojson }};
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="{{ url_for('static', filename='js/InteractiveMap.js') }}"></script>

</body>

</html>
