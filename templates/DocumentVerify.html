<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Document Verification</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/DocumentVerify.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">
AI Real Estate
</div>

<a href="Dashboard.html">
🏠 Dashboard
</a>

</nav>

<div class="container">

<h1>AI Document Verification</h1>

<div class="uploadBox">

<label>Upload Property Document</label>

<input
type="file"
id="documentFile"
accept=".pdf,.jpg,.jpeg,.png">

</div>

<div class="preview">

<h3>Document Preview</h3>

<img
id="previewImage"
src=""
style="display:none;">

<p id="fileName">
No file selected
</p>

</div>

<button onclick="verifyDocument()">

Verify Document

</button>

<div class="result">

<h2 id="verifyResult">

Verification Status :
Waiting...

</h2>

</div>

</div>
<script src="{{ url_for('static', filename='js/DocumentVerify.js') }}"></script>

</body>
</html>
