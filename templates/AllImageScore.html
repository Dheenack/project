<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Image Score</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/AllImageScore.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">
AI Real Estate
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</nav>

<div class="container">

<h1>AI Property Image Analysis</h1>

<div class="uploadBox">

<label>Upload Property Image</label>

<input
type="file"
id="imageFile"
accept="image/*">

</div>

<div class="preview">

<h3>Image Preview</h3>

<img
id="previewImage"
src=""
style="display:none;">

<p id="fileName">
No Image Selected
</p>

</div>

<button onclick="analyzeImage()">

Analyze Image

</button>

<div class="result">

<h2 id="scoreResult">

AI Score :
Waiting...

</h2>

</div>

</div>
<script src="{{ url_for('static', filename='js/AllImageScore.js') }}"></script>

</body>
</html>
