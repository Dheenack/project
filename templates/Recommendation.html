<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Recommendation</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/Recommendation.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">
AI Real Estate
</div>

<a href="Dashboard.html">🏠 Dashboard</a>

</nav>

<div class="container">

<h1>AI Property Recommendation</h1>

<form>

<div class="row">

<div class="inputBox">

<label>Budget (₹)</label>

<input
type="number"
id="budget"
placeholder="Enter Budget">

</div>

<div class="inputBox">

<label>City</label>

<select id="city">

<option>Pondicherry</option>
<option>Cuddalore</option>

</select>

</div>

</div>

<div class="row">

<div class="inputBox">

<label>Property Type</label>

<select id="type">

<option>Apartment</option>
<option>Villa</option>
<option>Independent House</option>
<option>Commercial</option>

</select>

</div>

<div class="inputBox">

<label>BHK</label>

<select id="bhk">

<option>1 BHK</option>
<option>2 BHK</option>
<option>3 BHK</option>
<option>4 BHK</option>

</select>

</div>

</div>

<button
type="button"
onclick="recommendProperty()">

Recommend Property

</button>

</form>

<div class="result">

<h2 id="recommendationResult">

Recommended Property :
Waiting...

</h2>

</div>

</div>
<script src="{{ url_for('static', filename='js/Recommendation.js') }}"></script>

</body>
</html>
